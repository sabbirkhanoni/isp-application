name: Database backup

# Supabase free has no automatic backups, so we take our own encrypted dump every night
# and keep it as a private workflow artifact for 30 days.
on:
  schedule:
    - cron: '30 19 * * *' # 01:30 Asia/Dhaka
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 age
      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          pg_dump --no-owner --no-privileges --format=custom "$BACKUP_DATABASE_URL" \
            | age -r "$BACKUP_AGE_PUBLIC_KEY" > "backup-$(date -u +%F).dump.age"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.dump.age
          retention-days: 30
          if-no-files-found: error
